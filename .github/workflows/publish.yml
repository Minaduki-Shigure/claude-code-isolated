name: Build, test and publish isolated images

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-isolated-${{ github.ref }}
  cancel-in-progress: false

env:
  RUNTIME_IMAGE: ghcr.io/minaduki-shigure/claude-code-isolated
  GATEWAY_IMAGE: ghcr.io/minaduki-shigure/claude-code-isolated-gateway

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Source validation
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/*.py tests/integration.py
          bash -n scripts/*.sh
          cd gateway
          go test -race ./...
          go vet ./...

  resolve:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      runtime_base: ${{ steps.inputs.outputs.runtime_base }}
      gateway_base: ${{ steps.inputs.outputs.gateway_base }}
      go_base: ${{ steps.inputs.outputs.go_base }}
      claude_version: ${{ steps.inputs.outputs.claude_version }}
      build_date: ${{ steps.date.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Resolve stable, verify signed manifest and lock base digests
        id: inputs
        run: python3 scripts/upstream.py resolve
      - id: date
        run: printf 'value=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-inputs
          path: |
            dist/build-inputs.json
            dist/manifest.json
            dist/manifest.json.sig
            dist/release-key.asc
          if-no-files-found: error
          retention-days: 90

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-inputs
          path: dist
      - name: Verify official native binary against signed manifest
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/upstream.py fetch --arch "$ARCH"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build runtime candidate with SBOM and provenance
        id: runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.RUNTIME_IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: |
            RUNTIME_BASE=${{ needs.resolve.outputs.runtime_base }}
            GATEWAY_BASE=${{ needs.resolve.outputs.gateway_base }}
            GO_BASE=${{ needs.resolve.outputs.go_base }}
            CLAUDE_VERSION=${{ needs.resolve.outputs.claude_version }}
            BUILD_DATE=${{ needs.resolve.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=runtime-${{ matrix.arch }}
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - name: Build gateway candidate with SBOM and provenance
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: gateway
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.GATEWAY_IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: |
            RUNTIME_BASE=${{ needs.resolve.outputs.runtime_base }}
            GATEWAY_BASE=${{ needs.resolve.outputs.gateway_base }}
            GO_BASE=${{ needs.resolve.outputs.go_base }}
            CLAUDE_VERSION=${{ needs.resolve.outputs.claude_version }}
            BUILD_DATE=${{ needs.resolve.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=gateway-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=gateway-${{ matrix.arch }}
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - name: Verify exact published candidates together
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker pull "$RUNTIME_IMAGE@$RUNTIME_DIGEST"
          docker pull "$GATEWAY_IMAGE@$GATEWAY_DIGEST"
          python3 tests/integration.py \
            --runtime-image "$RUNTIME_IMAGE@$RUNTIME_DIGEST" \
            --gateway-image "$GATEWAY_IMAGE@$GATEWAY_DIGEST" \
            --output "dist/integration-$ARCH.json"
      - name: Scan runtime and gate fixable critical/high issues
        if: ${{ !cancelled() && steps.runtime.outputs.digest != '' }}
        env:
          DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          docker pull "$RUNTIME_IMAGE@$DIGEST"
          bash scripts/scan.sh "$RUNTIME_IMAGE@$DIGEST" runtime
      - name: Scan gateway and gate fixable critical/high issues
        if: ${{ !cancelled() && steps.gateway.outputs.digest != '' }}
        env:
          DIGEST: ${{ steps.gateway.outputs.digest }}
        run: |
          docker pull "$GATEWAY_IMAGE@$DIGEST"
          bash scripts/scan.sh "$GATEWAY_IMAGE@$DIGEST" gateway
      - name: Record tested digests only after every check passes
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          printf '%s\n' "$RUNTIME_DIGEST" > "dist/runtime-$ARCH.txt"
          printf '%s\n' "$GATEWAY_DIGEST" > "dist/gateway-$ARCH.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: tested-${{ matrix.arch }}
          path: |
            dist/runtime-*.txt
            dist/gateway-*.txt
            dist/integration-*.json
            dist/vulnerabilities-*.json
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tested-*
          path: tested
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble both tested architecture pairs
        id: release
        env:
          VERSION: ${{ needs.resolve.outputs.claude_version }}
        run: |
          set -euo pipefail
          tag="$VERSION-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for kind in runtime gateway; do
            if [[ "$kind" == runtime ]]; then image="$RUNTIME_IMAGE"; else image="$GATEWAY_IMAGE"; fi
            amd64=$(cat "tested/tested-amd64/$kind-amd64.txt")
            arm64=$(cat "tested/tested-arm64/$kind-arm64.txt")
            [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools create --tag "$image:$tag" "$image@$amd64" "$image@$arm64"
            digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s_digest=%s\n' "$kind" "$digest" >> "$GITHUB_OUTPUT"
          done
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Attest runtime multi-platform image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.RUNTIME_IMAGE }}
          subject-digest: ${{ steps.release.outputs.runtime_digest }}
          push-to-registry: true
      - name: Attest gateway multi-platform image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GATEWAY_IMAGE }}
          subject-digest: ${{ steps.release.outputs.gateway_digest }}
          push-to-registry: true
      - name: Promote after both images on both architectures pass
        env:
          RUNTIME_DIGEST: ${{ steps.release.outputs.runtime_digest }}
          GATEWAY_DIGEST: ${{ steps.release.outputs.gateway_digest }}
          VERSION: ${{ needs.resolve.outputs.claude_version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$RUNTIME_IMAGE:latest" --tag "$RUNTIME_IMAGE:$VERSION" "$RUNTIME_IMAGE@$RUNTIME_DIGEST"
          docker buildx imagetools create --tag "$GATEWAY_IMAGE:latest" --tag "$GATEWAY_IMAGE:$VERSION" "$GATEWAY_IMAGE@$GATEWAY_DIGEST"
          printf '### Published tested image pair\n\n- Release tag: `%s`\n- Runtime: `%s@%s`\n- Gateway: `%s@%s`\n' \
            "$TAG" "$RUNTIME_IMAGE" "$RUNTIME_DIGEST" "$GATEWAY_IMAGE" "$GATEWAY_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '\nUse the same immutable release tag for both services; moving latest tags are not transactionally updated by GHCR.\n' >> "$GITHUB_STEP_SUMMARY"
